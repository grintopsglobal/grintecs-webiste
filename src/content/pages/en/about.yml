values:
  heading: "What we stand by"
  items:
    - title: "Secure from the start"
      text: "We treat security as a design requirement, as important as function."
    - title: "Honest about scope"
      text: "We state risks and limits up front, including when the answer is not to build something."
    - title: "Maintainable"
      text: "We write code, infrastructure, and documentation so another team can pick them up easily."
    - title: "Measurable results"
      text: "Every project stage has agreed targets that we can check together."
